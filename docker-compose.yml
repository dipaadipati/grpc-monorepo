version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    
    container_name: gym-backend
    restart: always
    ports:
      - "127.0.0.1:50051:50051"
    env_file:
      - .env
    environment:
      - REDIS_HOST=gym-redis-container
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    image: postgres:15-alpine
    container_name: gym-postgres-container
    environment:
      POSTGRES_USER: gym_user
      POSTGRES_PASSWORD: gym_password
      POSTGRES_DB: gym_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - gym-network

  redis:
    image: redis:7-alpine
    container_name: gym-redis-container
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - gym-network

volumes:
  pgdata:
  redisdata:

networks:
  gym-network:
    driver: bridge