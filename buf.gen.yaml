version: v2
plugins:
  - local: protoc-gen-es
    out: backend/src/gen
    opt:
      - target=ts
  - local: protoc-gen-connect-es
    out: backend/src/gen
    opt:
      - target=ts

  - local: protoc-gen-es
    out: frontend/src/gen
    opt:
      - target=ts
  - local: protoc-gen-connect-es
    out: frontend/src/gen
    opt:
      - target=ts

  - local: protoc-gen-dart
    out: mobile/lib/gen
    opt:
      - grpc